<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Metas de Cotas</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px;}
h1{text-align:center;}
.container{max-width:700px;margin:auto;}
input,button{padding:8px;margin:5px 0;border:none;border-radius:6px;}
input{width:100%;}
button{cursor:pointer;font-weight:bold;}
.add-btn{background:#4CAF50;color:white;width:100%;}
.card{background:#1e1e1e;padding:15px;border-radius:10px;margin-top:15px;}
.barra{width:100%;height:20px;background:#333;border-radius:10px;overflow:hidden;margin:8px 0;}
.progresso{height:100%;transition:0.4s;}
.actions button{margin:3px;padding:6px 10px;font-size:12px;}
.nivel{font-weight:bold;margin-top:5px;}
.dividendos{font-size:14px;margin-top:5px;color:#FFD700;}
</style>
</head>
<body>
<div class="container">
  <h1>📊 Metas de Cotas</h1>
  <input type="text" id="nome" placeholder="Código do ativo (ex: BBSE3)">
  <input type="number" id="cotas" placeholder="Quantidade">
  <input type="number" id="meta" placeholder="Meta" value="100">
  <input type="number" id="preco" placeholder="Preço médio (R$)">
  <button class="add-btn" onclick="adicionarAtivo()">Adicionar Ativo</button>
  <div id="lista"></div>
</div>

<script>
let ativos = JSON.parse(localStorage.getItem("ativos")) || [];

function salvar(){ localStorage.setItem("ativos", JSON.stringify(ativos)); }
function calcularNivel(cotas){ return Math.floor(cotas / 100) + 1; }
function corNivel(nivel){ if(nivel==1) return "#777"; if(nivel==2) return "#2196F3"; if(nivel==3) return "#4CAF50"; if(nivel>=4) return "#FFD700"; }
function calcularProgresso(cotas, meta){ return Math.min((cotas/meta)*100,100); }

// Busca DY anual via BrAPI e contorna CORS
async function buscarDY(codigo){
  try{
    const url = encodeURIComponent(`https://brapi.dev/api/quote/${codigo}?fundamental=true`);
    const res = await fetch(`https://api.allorigins.win/get?url=${url}`);
    const data = await res.json();
    const parsed = JSON.parse(data.contents);
    if(parsed.results && parsed.results[0] && parsed.results[0].dividendYield){
      return parseFloat(parsed.results[0].dividendYield);
    }
  }catch(e){ console.log("Erro DY", codigo, e); }
  return null;
}

// CRUD
async function adicionarAtivo(){
  const nome = document.getElementById("nome").value.trim().toUpperCase();
  const cotas = parseInt(document.getElementById("cotas").value);
  const meta = parseInt(document.getElementById("meta").value);
  const preco = parseFloat(document.getElementById("preco").value);
  if(!nome || isNaN(cotas) || isNaN(meta) || isNaN(preco)) return alert("Preencha tudo corretamente");

  let dy = await buscarDY(nome);

  ativos.push({
    id: Date.now(), nome, cotas, meta, preco, dy
  });
  salvar(); atualizarUI();
  document.getElementById("nome").value=""; document.getElementById("cotas").value=""; document.getElementById("preco").value="";
}

function remover(id){ ativos = ativos.filter(a=>a.id!==id); salvar(); atualizarUI(); }
function editarMeta(id){ const nova = prompt("Nova meta:"); if(!nova) return; const ativo = ativos.find(a=>a.id===id); ativo.meta=parseInt(nova); salvar(); atualizarUI(); }
function alterarCota(id,valor){ const ativo = ativos.find(a=>a.id===id); ativo.cotas+=valor; if(ativo.cotas<0) ativo.cotas=0; if(ativo.cotas>=ativo.meta){ ativo.meta+=100; alert("🎉 Meta batida! Nova meta: "+ativo.meta); } salvar(); atualizarUI(); }

// UI
function atualizarUI(){
  const lista = document.getElementById("lista"); lista.innerHTML="";
  ativos.forEach(ativo=>{
    const nivel = calcularNivel(ativo.cotas);
    const progresso = calcularProgresso(ativo.cotas, ativo.meta);
    const cor = corNivel(nivel);
    const dividendos = ativo.dy && ativo.preco ? (ativo.cotas*ativo.preco*(ativo.dy/12)).toFixed(2) : "-";
    lista.innerHTML += `
      <div class="card">
        <h3>${ativo.nome}</h3>
        <div>${ativo.cotas} / ${ativo.meta} cotas</div>
        <div class="barra"><div class="progresso" style="width:${progresso}%; background:${cor}"></div></div>
        <div class="nivel" style="color:${cor}">Nível ${nivel}</div>
        <div class="dividendos">📈 Dividendos/mês: R$ ${dividendos}</div>
        <div class="actions">
          <button onclick="alterarCota(${ativo.id},1)">+1</button>
          <button onclick="alterarCota(${ativo.id},-1)">-1</button>
          <button onclick="editarMeta(${ativo.id})">Editar Meta</button>
          <button onclick="remover(${ativo.id})">Excluir</button>
        </div>
      </div>
    `;
  });
}

atualizarUI();
</script>
</body>
</html>
