name: Calendario Invest CI

on:
  push:
    branches: [calendario-invest]
  pull_request:
    paths:
      - "calendario-invest/**"
      - ".github/workflows/calendario-invest-ci.yml"

permissions:
  contents: read

jobs:
  testes-e-seguranca:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendario-invest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: calendario-invest/requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          node --check static/app.js
          node --check static/tutorial.js
          node --check static/apoio.js

      - name: Validar configuracao da Vercel
        run: python -m json.tool vercel.json > /dev/null

  documentacao-e-privacidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir documentos e campos de coleta
        shell: bash
        run: |
          cd calendario-invest
          for arquivo in LICENSE.md CONTRIBUTING.md docs/REVISAO-OPERACIONAL.md templates/legal.html templates/rodape.html; do
            test -s "$arquivo"
          done
          if grep -nE 'name="detalhes"|id="detailsLabel"' templates/*.html; then
            echo "Campo de detalhes bancários reintroduzido"
            exit 1
          fi

  deploy-vercel:
    name: Publicar na Vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/calendario-invest'
    needs: [testes-e-seguranca, documentacao-e-privacidade]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: calendario-invest-producao
      cancel-in-progress: false
    defaults:
      run:
        working-directory: calendario-invest
    env:
      VERCEL_ORG_ID: team_t8B9eKBs3gXOyLwxsRhWyAdj
      VERCEL_PROJECT_ID: prj_M6Mpu8qPzjpKkVeVpkZbUvexNaVd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar o commit atual
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          remoto="$(git ls-remote --exit-code origin refs/heads/calendario-invest)"
          if [ "${remoto%%$'\t'*}" != "$GITHUB_SHA" ]; then
            echo "Já existe um commit mais recente na branch."
            exit 0
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Configure o secret VERCEL_TOKEN no GitHub Actions."
            exit 1
          fi
          npx --yes vercel@59.23.2 deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Verificar a home publicada
        run: |
          for tentativa in {1..8}; do
            if home="$(curl --fail --silent --show-error --max-time 10 "https://meta.wasxtech.com.br/?ci=${GITHUB_SHA}-${tentativa}")" &&
               grep -Fq 'id="tutorial-capturas"' <<< "$home"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::O carrossel não apareceu no domínio de produção."
          exit 1
