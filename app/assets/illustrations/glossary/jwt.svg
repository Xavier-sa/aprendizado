<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title desc">
  <title id="title">Partes de um JWT</title><desc id="desc">Token dividido em header, payload e signature.</desc>
  <rect width="420" height="220" rx="18" fill="#f5f7f3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#fff"><rect x="24" y="58" width="112" height="100" rx="16" fill="#394a68"/><rect x="154" y="58" width="112" height="100" rx="16" fill="#246b63"/><rect x="284" y="58" width="112" height="100" rx="16" fill="#654978"/><text x="80" y="104" font-size="17" font-weight="700">Header</text><text x="80" y="128" font-size="12">algoritmo</text><text x="210" y="104" font-size="17" font-weight="700">Payload</text><text x="210" y="128" font-size="12">dados</text><text x="340" y="104" font-size="17" font-weight="700">Signature</text><text x="340" y="128" font-size="12">verificação</text><text x="145" y="115" fill="#75a400" font-size="24">.</text><text x="275" y="115" fill="#75a400" font-size="24">.</text><text x="210" y="190" fill="#587c00" font-size="14" font-weight="700">cabeçalho + dados + assinatura</text></g>
</svg>
